<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cards</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/app-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Collection Hub">
    <meta name="theme-color" content="#14161a">

    <link rel="stylesheet" href="../../navbar.css">
    <link rel="stylesheet" href="../style.css" />

    <style>
        .pokemon-card.not-owned img {
            filter: grayscale(1) brightness(0.45);
            opacity: 0.6;
        }

        .special-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            color: var(--accent);
            font-size: 1.1rem;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .pokemon-card {
            position: relative;
        }

        .generation-filter-btn.include-btn:hover {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #22c55e;
        }

        .generation-filter-btn.exclude-btn:hover {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        #game-filter-container.filters-disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .cards-page.page-mode #box-container {
            display: grid;
            gap: 12px;
            justify-content: center;
        }

        .cards-page.page-mode.first-page #box-container {
            grid-template-columns: repeat(4, 150px);
            max-width: none;
        }

        .cards-page.page-mode:not(.first-page) #box-container {
            grid-template-columns: repeat(8, 150px);
            max-width: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-direction: row !important;
        }

        .checkbox-label input {
            width: auto !important;
        }
    </style>
</head>
<body class="item-page cards-page">

    <div id="navbar"></div>

    <script src="../collection-nav.js"></script>

    <a class="back-button" href="../collectionhub.html">← Back</a>

    <h1>Cards</h1>

    <div id="deck-tabs"></div>

    <!-- =========================
        SEARCH
    ========================== -->
    <div id="search-wrapper">
        <div id="search-row">
            <input id="search" type="text" placeholder="Search..." />
            <span id="clear-search">✕</span>
        </div>
    </div>

    <div id="import-export-controls" class="filter-row width-sync-pending">
        <input type="file" id="import-items" accept=".json" hidden>
        <button id="import-button" class="game-filter-btn">Import</button>
        <button id="export-items" class="game-filter-btn">Export</button>
    </div>

    <!-- =========================
        MODE + PAGINATION
    ========================== -->
    <div id="page-controls">

        <button id="list-mode">List Mode</button>
        <button id="page-mode">Page Mode</button>

        <div id="pagination-controls" class="hidden">
            <button id="prev-page">◀</button>
            <span id="page-display">1</span>
            <button id="next-page">▶</button>
        </div>

        <button id="todo-filter-btn" class="hidden" title="Pokémon cards only: show only the cards on the to-do list, in Pokédex order">📝 To Do</button>
        <button id="todo-add-matches-btn" class="hidden" title="Pick which of your current search's unowned matches to add to the to-do list">📝 Add Matches</button>
        <button id="todo-add-btn" class="hidden" title="Add Pokémon to the to-do list by typing or speaking their names">➕ Add To Do</button>
        <button id="todo-find-btn" class="hidden" title="Step through the to-do list one binder page at a time">🔍 Find</button>
        <button id="todo-owned-btn" class="hidden" title="Mark every card on the to-do list as owned">✅ Make All Owned</button>
        <button id="todo-clear-btn" class="hidden" title="Take every card off the to-do list">🗑 Clear All</button>
        <button id="todo-prev-btn" class="hidden" title="Previous to-do card">◀ Prev</button>
        <button id="todo-next-btn" class="hidden" title="Jump to the page of the next to-do card">Next ▶</button>
        <button id="add-item">Add Card</button>
        <button id="stats-btn">Stats</button>

    </div>

    <!-- =========================
        GRID
    ========================== -->
    <div id="box-container"></div>

    <div id="add-item-modal" class="hidden">

        <div class="add-item-box">

            <h2 id="item-modal-title">Add Card</h2>

            <div id="item-error" class="hidden"></div>

            <label>
                Name
                <input type="text" id="item-title">
            </label>

            <label class="checkbox-label">
                <input type="checkbox" id="item-owned"> Owned
            </label>

            <label id="item-position-row">
                Insert at position (blank = end)
                <input type="number" id="item-position" min="1">
            </label>

            <div class="modal-buttons">
                <button id="save-item">Save</button>
                <button id="cancel-item">Cancel</button>
            </div>

        </div>

    </div>

    <!-- =========================
        MODAL
    ========================== -->
    <div id="modal-overlay" class="hidden">

        <div id="modal-nav-left" class="modal-nav">◀</div>

        <div id="pokemon-modal">

            <div id="modal-close" class="modal-close-btn">✕</div>

            <div class="modal-left">

                <div id="modal-title"></div>

                <div class="modal-image-wrapper">
                    <img id="modal-image" src="">
                </div>

            </div>

            <div class="modal-right">

                <div class="item-field">
                    <strong>Owned:</strong>
                    <div id="modal-owned"></div>
                </div>

                <div class="item-field" id="modal-special-row">
                    <strong>Special:</strong>
                    <div id="modal-special"></div>
                </div>

                <div class="item-field" id="modal-dex-row">
                    <strong>Dex #:</strong>
                    <div id="modal-dex"></div>
                </div>

                <div class="item-actions">
                    <button id="edit-item" class="item-action-btn">Edit</button>
                    <button id="delete-item" class="item-action-btn danger">Delete</button>
                </div>

            </div>

        </div>

        <div id="modal-nav-right" class="modal-nav">▶</div>

    </div>

    <!-- To Do list (Pokémon deck only) — same three pieces as the Pokédex
         page: typed/spoken Add To Do box, Add Matches checklist, and the
         remove confirmation. See the TO DO LIST block in cards.js. -->
    <div id="todo-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="todo-modal-close" class="modal-close-btn">✕</div>
            <h2 id="todo-modal-title">Add To Card To Do List</h2>
            <div id="todo-modal-search-row">
                <input type="text" id="todo-modal-input" placeholder="Pikachu, Charizard, Bulbasaur...">
                <span id="todo-modal-terms-toggle" class="search-terms-toggle" title="Show pokemon to add">▾</span>
                <span id="todo-modal-clear" class="clear-search" title="Clear">✕</span>
            </div>
            <div id="todo-modal-terms-panel" class="search-terms-panel" hidden></div>
            <p id="todo-modal-error" class="hidden"></p>
            <button id="todo-modal-submit" class="item-action-btn stats-detail-btn">Add</button>
        </div>
    </div>

    <div id="todo-matches-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="todo-matches-modal-close" class="modal-close-btn">✕</div>
            <h2>Add To Card To Do List</h2>
            <p>Select which of these should be added to the to-do list:</p>
            <div id="todo-matches-modal-list"></div>
            <div class="todo-matches-actions">
                <button id="todo-matches-modal-submit" class="item-action-btn stats-detail-btn">Add</button>
                <button id="todo-matches-modal-add-all" class="item-action-btn stats-detail-btn">Add All</button>
            </div>
        </div>
    </div>

    <div id="todo-remove-confirm-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="todo-remove-confirm-close" class="modal-close-btn">✕</div>
            <h2 id="todo-remove-confirm-title">Remove From To Do?</h2>
            <p id="todo-remove-confirm-text"></p>
            <button id="todo-remove-confirm-yes" class="item-action-btn danger stats-detail-btn">Yes, remove it</button>
            <button id="todo-remove-confirm-no" class="item-action-btn stats-detail-btn">No</button>
        </div>
    </div>

    <div id="todo-notice-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="todo-notice-close" class="modal-close-btn">✕</div>
            <p id="todo-notice-text"></p>
            <button id="todo-notice-ok" class="item-action-btn stats-detail-btn">OK</button>
        </div>
    </div>

    <div id="image-zoom-overlay" class="hidden">
        <img id="zoom-image" />
    </div>

    <div id="stats-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="stats-modal-close" class="modal-close-btn">✕</div>
            <h2>Card Stats</h2>
            <div id="stats-modal-body"></div>
        </div>
    </div>

    <script src="../mobile-popout.js"></script>
    <script src="../voice-search.js"></script>
    <script src="../unsaved-changes.js"></script>
    <script src="../export-to-github.js"></script>
    <script src="recent-set.js"></script>
    <script src="cards.js"></script>

<script src="../../scroll-to-top.js"></script>
<script type="module" src="../../admin-auth.js"></script>
</body>
</html>
