<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Completions</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/app-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Collection Hub">
    <meta name="theme-color" content="#14161a">

    <link rel="stylesheet" href="../navbar.css">
    <link rel="stylesheet" href="style.css" />
</head>
<body class="item-page completions-page">

    <div id="navbar"></div>

    <script src="collection-nav.js"></script>

    <a class="back-button" href="collectionhub.html">← Back</a>

    <h1>Completions</h1>

    <div id="deck-tabs">
        <button id="tab-completions-btn" type="button" class="deck-tab-btn deck-tab-active">Completions</button>
        <button id="tab-milestones-btn" type="button" class="deck-tab-btn">Milestones</button>
    </div>

    <div id="completions-view">

    <!-- =========================
        SEARCH
    ========================== -->
    <div id="search-wrapper">
        <div id="search-row">
            <input id="search" type="text" placeholder="Search Sleeves..." />
            <span id="clear-search">✕</span>
        </div>
    </div>

    <button id="untagged-filter" class="filter-relocating">Untagged</button>

    <!-- =========================
        MODE + PAGINATION
    ========================== -->


    <div id="page-controls">

        <button id="list-mode">List Mode</button>
        <button id="page-mode">Page Mode</button>

        <div id="pagination-controls" class="hidden">

            <button id="prev-page">◀</button>
            <span id="page-display">1</span>
            <button id="next-page">▶</button>

        </div>

        <button id="add-item">Add Completion</button>
        <input type="file" id="import-items" accept=".json" hidden>
        <button id="import-button">Import</button>
        <button id="export-items">Export</button>
        <button id="stats-btn">Stats</button>
        <button id="scan-dlc-btn" class="hidden">Scan for DLCs</button>

    </div>

    <!-- =========================
        GRID
    ========================== -->
    <div id="box-container"></div>

    </div>

    <!-- =========================
        MILESTONES (separate, self-contained tab — just a name + image per
        card, no owned/special/DLC. See milestones.js.)
    ========================== -->
    <div id="milestones-view" class="hidden">

        <div id="milestones-controls">
            <button id="add-milestone">Add Milestone</button>
            <input type="file" id="import-milestones" accept=".json" hidden>
            <button id="import-milestones-button">Import</button>
            <button id="export-milestones">Export</button>
        </div>

        <div id="milestones-container"></div>

    </div>

    <div id="add-milestone-modal" class="hidden">

        <div class="add-item-box">

            <h2 id="milestone-modal-title-text">Add Milestone</h2>

            <div id="milestone-item-error" class="hidden"></div>

            <label>
                Name
                <input type="text" id="milestone-title">
            </label>

            <label id="milestone-position-row">
                Insert at position (blank = end)
                <input type="number" id="milestone-position" min="1">
            </label>

            <div class="modal-buttons">
                <button id="save-milestone">Save</button>
                <button id="cancel-milestone">Cancel</button>
            </div>

        </div>

    </div>

    <div id="milestone-modal-overlay" class="hidden">

        <div id="milestone-modal-nav-left" class="modal-nav">◀</div>

        <div id="milestone-modal">

            <div id="milestone-modal-close" class="modal-close-btn">✕</div>

            <div class="modal-left">

                <div id="milestone-modal-name"></div>

                <img id="milestone-modal-image" src="">

            </div>

            <div class="modal-right">

                <div class="item-actions">

                    <button id="edit-milestone" class="item-action-btn">Edit Milestone</button>
                    <button id="delete-milestone" class="item-action-btn danger">Delete Milestone</button>

                </div>

            </div>

        </div>

        <div id="milestone-modal-nav-right" class="modal-nav">▶</div>

    </div>

    <div id="add-item-modal" class="hidden">

        <div class="add-item-box">

            <h2 id="item-modal-title">Add Completion</h2>

            <div id="item-error" class="hidden"></div>

            <label>
                Title
                <input type="text" id="item-title">
            </label>

            <label>
                Completion Date
                <input type="date" id="item-date">
                <button type="button" id="item-date-today" class="today-btn">Today</button>
            </label>

            <label>
                Franchise
                <input type="text" id="item-custom">
            </label>

            <label>
                Tags (comma separated)
                <input type="text" id="item-tags">
            </label>

            <button id="preview-image-btn">View Image</button>

            <div class="modal-buttons">
                <button id="save-item">Save</button>
                <button id="cancel-item">Cancel</button>
            </div>

        </div>

    </div>

    <div id="add-dlc-modal" class="hidden">

        <div class="add-item-box">

            <h2>Add DLC</h2>

            <label>
                DLC Image Name
                <input type="text" id="dlc-name">
            </label>

            <div id="dlc-error" class="hidden"></div>

            <div class="modal-buttons">
                <button id="save-dlc">Save</button>
                <button id="cancel-dlc">Cancel</button>
            </div>

        </div>

    </div>

    <div id="rename-dlc-modal" class="hidden">

        <div class="add-item-box">

            <h2>Name this DLC</h2>

            <img id="rename-dlc-image" src="" alt="">

            <label>
                Name
                <input type="text" id="rename-dlc-input">
            </label>

            <div class="modal-buttons">
                <button id="save-rename-dlc">Save</button>
                <button id="cancel-rename-dlc">Cancel</button>
            </div>

        </div>

    </div>

    <div id="delete-dlc-modal" class="hidden">

        <div class="add-item-box">

            <h3>Delete DLC</h3>

            <div id="delete-dlc-list"></div>

            <div class="modal-buttons">
                <button id="confirm-delete-dlc">Delete</button>
                <button id="cancel-delete-dlc">Cancel</button>
            </div>

            <div id="delete-dlc-error"></div>
        </div>
    </div>

    <div id="reorder-dlc-modal" class="hidden">

        <div class="add-item-box">

            <h3>Reorder DLCs</h3>

            <div id="reorder-dlc-list"></div>

            <div class="modal-buttons">
                <button id="close-reorder-dlc">Done</button>
            </div>

        </div>
    </div>

    <!-- =========================
        MODAL
    ========================== -->
    <div id="modal-overlay" class="hidden">

        <div id="modal-nav-left" class="modal-nav">◀</div>

        <div id="pokemon-modal">

            <div id="modal-close" class="modal-close-btn">✕</div>

            <div class="modal-left">

                <div id="modal-title"></div>

                <img id="modal-image" src="">

            </div>

            <div class="modal-right">

                <div class="item-field">
                    <strong>Completion Date:</strong>
                    <div id="modal-date"></div>
                </div>

                <div class="item-field">
                    <strong>Franchise:</strong>
                    <div id="modal-custom"></div>
                </div>

                <div class="item-field">
                    <strong>Tags:</strong>
                    <div id="modal-tags"></div>
                </div>

                <div class="item-actions">

                    <button id="edit-item" class="item-action-btn">Edit Completion</button>
                    <button id="delete-item" class="item-action-btn danger">Delete Completion</button>

                    <div class="dlc-editor">
                        <div class="dlc-header">
                            <h3>DLCs</h3>
                            <div class="dlc-header-buttons">
                                <button id="delete-dlcs-btn" class="dlc-action-btn">Delete DLC</button>
                                <button id="reorder-dlcs-btn" class="dlc-action-btn">Edit Order</button>
                                <button id="add-dlc-btn" class="dlc-action-btn">Add DLC</button>
                            </div>
                        </div>

                        <div id="modal-dlc-carousel">
                            <button id="dlc-prev-btn" class="dlc-carousel-nav" type="button" aria-label="Previous DLC">◀</button>

                            <div class="dlc-carousel-content">
                                <div id="modal-dlc-name"></div>
                                <img id="modal-dlc-image">
                                <button id="modal-dlc-name-btn" class="dlc-name-btn hidden" type="button">Name this DLC</button>
                            </div>

                            <button id="dlc-next-btn" class="dlc-carousel-nav" type="button" aria-label="Next DLC">▶</button>
                        </div>

                        <div id="modal-dlc-empty" class="hidden">No DLCs yet.</div>

                    </div>

                </div>

            </div>

        </div>

        <div id="modal-nav-right" class="modal-nav">▶</div>

    </div>

    <div id="image-zoom-overlay" class="hidden">
        <button id="zoom-dlc-prev-btn" class="modal-nav hidden" type="button" aria-label="Previous DLC">◀</button>
        <img id="zoom-image" />
        <button id="zoom-dlc-next-btn" class="modal-nav hidden" type="button" aria-label="Next DLC">▶</button>
    </div>

    <div id="stats-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="stats-modal-close" class="modal-close-btn">✕</div>
            <h2>Completion Stats</h2>
            <div id="stats-modal-body"></div>
        </div>
    </div>

    <div id="stats-detail-modal" class="stats-modal-overlay hidden">
        <div class="stats-modal-box">
            <div id="stats-detail-modal-close" class="modal-close-btn">✕</div>
            <h2 id="stats-detail-modal-title"></h2>
            <div id="stats-detail-modal-body"></div>
        </div>
    </div>

    <script>
    const COLLECTION = {
        name: "completions",
        storageKey: "completions",
        jsonFile: "completions-backup.json",
        imageFolder: "completions",
        
        fields: {
            title: "title",
            date: "dateCompleted",
            custom: "franchise",
            tags: "tags"
        },

    };
    </script>

    <script src="mobile-popout.js"></script>
    <script src="unsaved-changes.js"></script>
    <script src="collections.js"></script>
    <script src="milestones.js"></script>

<script src="../scroll-to-top.js"></script>
<script type="module" src="../admin-auth.js"></script>
</body>
</html>
